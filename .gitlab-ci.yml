image: ghcr.io/redmadrobot/android/android-sdk:36-ndk

stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key: "gradle-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

build_debug_apk:
  stage: build
  before_script:
    - chmod +x gradlew
    - git submodule sync --recursive
    - git submodule update --init --recursive
  script:
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    name: "Unexpected-Keyboard-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - build/outputs/apk/debug/*.apk
